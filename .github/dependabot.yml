# Aktualizacje zależności (R8, A18.9): Dependabot otwiera PR z poprawkami bezpieczeństwa i wersjami.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: monthly
